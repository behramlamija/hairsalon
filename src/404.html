<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stranica nije pronađena — Ilda</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      font-family: "Jost", system-ui, sans-serif; color: #221c1f; background: radial-gradient(ellipse at 80% 10%, #f3e2df, transparent 60%), #faf6f2; }
    .script { font-family: "Pinyon Script", cursive; font-size: 4.5rem; line-height: 1; margin: 0; }
    h1 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 2rem; margin: 16px 0 8px; }
    p { color: #6e6367; margin: 0 0 28px; }
    a { display: inline-block; padding: .95em 1.7em; border-radius: 999px; background: #221c1f; color: #fff; text-decoration: none; }
    a:hover { background: #b4546a; }
  </style>
</head>
<body>
  <main>
    <p class="script">Ilda</p>
    <h1>Ova stranica ne postoji</h1>
    <p>Možda je link pogrešno upisan — vratite se na početnu i rezervišite termin.</p>
    <a href="/">Na početnu</a>
  </main>
</body>
</html>
